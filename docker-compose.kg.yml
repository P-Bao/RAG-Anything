# KG branch, same split as ami-multimodal-retrieval: a resident API
# (kg-api, port 8009 — the old vector API port) and a resident ingest worker
# (kg-rag) sharing one image and one KG volume. The API enqueues jobs into the
# Redis Stream (REDIS_URL) and the worker executes them one at a time, so a
# single process ever writes the file-based KG. `docker compose run --rm kg-rag
# <cli args>` still works for read-only CLI commands (status/query).
# .env supplies REDIS/QWEN/NEMOTRON/MINIO/MONGO/OCR/RERANK hosts (container
# names on the external network when deployed beside them).
services:
  kg-api:
    build:
      context: .
      dockerfile: Dockerfile.kg
    container_name: kg-api
    env_file: .env
    environment:
      KG_WORKING_DIR: /app/rag_storage
      API_PORT: "8009"
    command:
      ["python", "-m", "uvicorn", "raganything.api:app", "--host", "0.0.0.0", "--port", "8009"]
    ports:
      - "8009:8009"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8009/healthz', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - kg-storage:/app/rag_storage
      - mineru-models:/models/huggingface
      - ./logs:/app/logs
    networks:
      - ami-network

  # Resident ingest worker: consumes the Redis job queue, one job at a time.
  kg-rag:
    build:
      context: .
      dockerfile: Dockerfile.kg
    container_name: kg-rag
    env_file: .env
    environment:
      KG_WORKING_DIR: /app/rag_storage
    command: ["python", "-m", "raganything.worker"]
    restart: unless-stopped
    volumes:
      - kg-storage:/app/rag_storage
      - mineru-models:/models/huggingface
      - ./logs:/app/logs
    networks:
      - ami-network

volumes:
  kg-storage:
    name: ${KG_VOLUME:-rag-storage}
  mineru-models:

networks:
  ami-network:
    external: true

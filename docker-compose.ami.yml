# AMI multimodal RAG: API (/v2/rag) + ingest worker (MinerU parse -> chunk -> embed máy B -> Qdrant).
# Mongo, Qdrant, Redis, MinIO and the rerank service run outside this compose on
# the external network `ami-network` (hosts in .env are container names there).
services:
  ami-rag-api:
    build:
      context: .
      dockerfile: Dockerfile.ami
    container_name: ami-rag-api
    ports:
      - "8009:8009"
    env_file: .env
    environment:
      WORKER_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: multimodal-rag-retrieval
      # Per-modality fusion knobs. Interpolated (not hardcoded) so a strategy can
      # be swept without editing .env, e.g.
      #   RETRIEVAL_FUSION_MODE=quota docker compose -f docker-compose.ami.yml up -d --build ami-rag-api
      # Default `single` keeps the original single-pool retrieve -> rerank flow.
      # Các default dưới đây PHẢI khớp `ami_rag/settings.py`; compose `environment:`
      # đè lên default của pydantic-settings nên lệch ở đây là container chạy sai
      # cấu hình. `tests/ami_service/test_config_consistency.py` chặn lệch.
      RETRIEVAL_FUSION_MODE: ${RETRIEVAL_FUSION_MODE:-single}
      RETRIEVAL_FUSION_POOLS: ${RETRIEVAL_FUSION_POOLS:-text+table,image}
      RETRIEVAL_FUSION_POOL_SIZES: ${RETRIEVAL_FUSION_POOL_SIZES:-text=50,image=15}
      RETRIEVAL_FUSION_RRF_K: ${RETRIEVAL_FUSION_RRF_K:-60}
      RETRIEVAL_FUSION_QUOTA: ${RETRIEVAL_FUSION_QUOTA:-text=3,image=2}
      RETRIEVAL_FUSION_IMAGE_GATE: ${RETRIEVAL_FUSION_IMAGE_GATE:-true}
      RETRIEVAL_FUSION_VL_POOLS: ${RETRIEVAL_FUSION_VL_POOLS:-text,image}
      # Re-exposed so a bench run can toggle it; `environment` wins over `env_file`.
      RERANK_CALIBRATION_ENABLED: ${RERANK_CALIBRATION_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ami-network

  ami-rag-worker:
    build:
      context: .
      dockerfile: Dockerfile.ami
    container_name: ami-rag-worker
    command: ["ami-rag-worker"]
    ports:
      - "9109:9109"
    env_file: .env
    environment:
      # No tracing in the worker (traces are only for /v2/rag); .env must not leak the
      # API's OTLP endpoint into it.
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SERVICE_NAME: multimodal-rag-ingest
    volumes:
      - mineru-models:/models
      - rag-output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # MinerU pipeline on GPU needs ~1-3.5 GiB (see MINERU_VIRTUAL_VRAM_SIZE in .env).
    # CPU only: remove this block and set MINERU_DEVICE=cpu (~5x slower).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - ami-network

volumes:
  mineru-models:
  rag-output:

networks:
  ami-network:
    external: true
